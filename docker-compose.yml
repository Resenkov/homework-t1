version: '3'
services:
  zookeeper:
    image: confluentinc/cp-zookeeper:latest
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:latest
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    healthcheck:
      test: nc -z localhost 9092
      interval: 5s
      timeout: 5s
      retries: 15

  kafka-setup:
    image: confluentinc/cp-kafka:latest
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: [ '/bin/sh', '-c' ]
    command: |
      "echo 'Waiting for Kafka...';
       while ! nc -z kafka 9092; do sleep 1; done;
       kafka-topics --bootstrap-server kafka:9092 --create --topic t1_demo_transactions --partitions 1 --replication-factor 1
       kafka-topics --bootstrap-server kafka:9092 --create --topic t1_demo_transaction_accept --partitions 1 --replication-factor 1
       kafka-topics --bootstrap-server kafka:9092 --create --topic t1_demo_metrics --partitions 1 --replication-factor 1
       kafka-topics --bootstrap-server kafka:9092 --create --topic t1_demo_transaction_result --partitions 1 --replication-factor 1
       echo 'Topics created successfully'"